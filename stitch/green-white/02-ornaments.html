<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Botanical Ornament Sheet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #FFFDFB;
      color: #2D321B;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-serif-title {
      font-family: 'Cormorant Garamond', serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[#FFFDFB] text-[#2D321B] p-6 md:p-12 flex flex-col items-center justify-start selection:bg-[#F4F5EF] selection:text-[#2D321B]">

  <!-- Main Sheet Container -->
  <main class="w-full max-w-3xl bg-[#FFFDFB] border border-[#E7E5DF] rounded-sm p-8 sm:p-12 transition-all">
    
    <!-- Sheet Header / Title block -->
    <header class="text-center pb-10 mb-8 border-b border-[#EBE8E1]">
      <span class="text-[10px] tracking-[0.25em] uppercase font-semibold text-[#666947] block mb-2">To‘y taklifnomasi uchun bezaklar</span>
      <h1 class="font-serif-title text-3xl sm:text-4xl tracking-wide font-normal text-[#2D321B] mb-2">Botanika Katalogi</h1>
      <p class="text-xs tracking-[0.15em] uppercase text-[#A69689]">Letterpress Stamp & Line-Art Sheet · 2026</p>
    </header>

    <!-- 2-Column Grid for isolated ornaments -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 sm:gap-10">

      <!-- 1. NOVDA -->
      <div class="flex flex-col items-center justify-between p-6 sm:p-8 rounded border border-[#F2EFE9] bg-[#FFFDFB] min-h-[220px]">
        <div class="flex-1 flex items-center justify-center w-full py-4">
          <!-- Jasmine sprig: thin curving stem with 5 small pointed leaves and one open five-petal flower near the tip -->
          <svg viewBox="0 0 160 160" width="130" height="130" class="overflow-visible" xmlns="http://www.w3.org/2000/svg">
            <!-- Stem -->
            <path d="M 40 140 Q 60 90 90 48 Q 105 28 120 20" fill="none" stroke="#2D321B" stroke-width="1.3" stroke-linecap="round"/>
            
            <!-- Leaf 1 (bottom left) -->
            <path d="M 48 116 C 36 112 32 104 35 96 C 44 96 52 106 50 113" fill="#666947" fill-opacity="0.18" stroke="#2D321B" stroke-width="1.2" stroke-linejoin="round"/>
            
            <!-- Leaf 2 (mid right) -->
            <path d="M 64 92 C 76 90 84 84 84 76 C 74 74 66 82 66 89" fill="#666947" fill-opacity="0.18" stroke="#2D321B" stroke-width="1.2" stroke-linejoin="round"/>
            
            <!-- Leaf 3 (mid left) -->
            <path d="M 72 74 C 60 70 56 60 60 52 C 70 54 75 64 74 71" fill="#666947" fill-opacity="0.18" stroke="#2D321B" stroke-width="1.2" stroke-linejoin="round"/>
            
            <!-- Leaf 4 (upper right) -->
            <path d="M 90 52 C 102 48 108 40 106 32 C 96 32 90 42 91 49" fill="#666947" fill-opacity="0.18" stroke="#2D321B" stroke-width="1.2" stroke-linejoin="round"/>
            
            <!-- Leaf 5 (near tip) -->
            <path d="M 103 36 C 96 26 92 18 97 12 C 105 15 107 26 104 33" fill="#666947" fill-opacity="0.18" stroke="#2D321B" stroke-width="1.2" stroke-linejoin="round"/>
            
            <!-- Five-petal flower near tip (x=118, y=22) -->
            <g transform="translate(118, 22)">
              <!-- Petals -->
              <path d="M 0 0 C -4 -9 4 -9 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.1"/>
              <path d="M 0 0 C 8 -7 11 0 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.1"/>
              <path d="M 0 0 C 7 6 2 10 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.1"/>
              <path d="M 0 0 C -6 8 -9 3 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.1"/>
              <path d="M 0 0 C -10 0 -8 -7 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.1"/>
              <circle cx="0" cy="0" r="1.8" fill="#666947"/>
            </g>
          </svg>
        </div>
        <caption class="text-[11px] font-medium tracking-[0.25em] text-[#666947] uppercase mt-2 block">
          NOVDA
        </caption>
      </div>

      <!-- 2. AJRATGICH -->
      <div class="flex flex-col items-center justify-between p-6 sm:p-8 rounded border border-[#F2EFE9] bg-[#FFFDFB] min-h-[220px]">
        <div class="flex-1 flex items-center justify-center w-full py-4">
          <!-- Horizontal divider: hairline running left and right from centered flower flanked by tiny leaves -->
          <svg viewBox="0 0 280 80" width="240" height="70" class="overflow-visible" xmlns="http://www.w3.org/2000/svg">
            <!-- Left rule -->
            <line x1="15" y1="40" x2="105" y2="40" stroke="#2D321B" stroke-width="0.8" stroke-linecap="round"/>
            <circle cx="15" cy="40" r="1.2" fill="#A69689"/>
            
            <!-- Right rule -->
            <line x1="175" y1="40" x2="265" y2="40" stroke="#2D321B" stroke-width="0.8" stroke-linecap="round"/>
            <circle cx="265" cy="40" r="1.2" fill="#A69689"/>

            <!-- Flanking tiny leaves -->
            <!-- Left leaf -->
            <path d="M 125 40 C 117 35 111 38 114 41 C 117 44 123 43 125 40 Z" fill="#666947" fill-opacity="0.3" stroke="#2D321B" stroke-width="0.9"/>
            <!-- Right leaf -->
            <path d="M 155 40 C 163 35 169 38 166 41 C 163 44 157 43 155 40 Z" fill="#666947" fill-opacity="0.3" stroke="#2D321B" stroke-width="0.9"/>

            <!-- Center flower at (140, 40) -->
            <g transform="translate(140, 40)">
              <!-- 5 symmetrical petals -->
              <!-- Top -->
              <path d="M 0 0 C -4 -11 4 -11 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.1"/>
              <!-- Top Right -->
              <path d="M 0 0 C 8 -8 11 -2 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.1"/>
              <!-- Bottom Right -->
              <path d="M 0 0 C 9 4 5 10 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.1"/>
              <!-- Bottom Left -->
              <path d="M 0 0 C -5 10 -9 4 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.1"/>
              <!-- Top Left -->
              <path d="M 0 0 C -11 -2 -8 -8 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.1"/>
              <circle cx="0" cy="0" r="2" fill="#666947" stroke="#2D321B" stroke-width="0.8"/>
            </g>
          </svg>
        </div>
        <caption class="text-[11px] font-medium tracking-[0.25em] text-[#666947] uppercase mt-2 block">
          AJRATGICH
        </caption>
      </div>

      <!-- 3. GUL -->
      <div class="flex flex-col items-center justify-between p-6 sm:p-8 rounded border border-[#F2EFE9] bg-[#FFFDFB] min-h-[220px]">
        <div class="flex-1 flex items-center justify-center w-full py-4">
          <!-- Single open five-petal flower seen from above, small round center, two leaves behind it -->
          <svg viewBox="0 0 160 160" width="130" height="130" class="overflow-visible" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(80, 80)">
              <!-- Two leaves behind (lower left and upper right) -->
              <path d="M -8 12 C -28 26 -38 46 -26 56 C -14 52 -6 32 -4 16 Z" fill="#666947" fill-opacity="0.22" stroke="#2D321B" stroke-width="1.2" stroke-linejoin="round"/>
              <path d="M -16 34 L -26 56" stroke="#2D321B" stroke-width="0.8"/>

              <path d="M 8 -12 C 28 -26 38 -46 26 -56 C 14 -52 6 -32 4 -16 Z" fill="#666947" fill-opacity="0.22" stroke="#2D321B" stroke-width="1.2" stroke-linejoin="round"/>
              <path d="M 16 -34 L 26 -56" stroke="#2D321B" stroke-width="0.8"/>

              <!-- 5 Petals from above (72 deg increments) -->
              <!-- Petal 1 (0 deg - top) -->
              <g transform="rotate(0)">
                <path d="M 0 -7 C -14 -14 -13 -36 0 -40 C 13 -36 14 -14 0 -7 Z" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.2" stroke-linejoin="round"/>
                <line x1="0" y1="-10" x2="0" y2="-28" stroke="#A69689" stroke-width="0.7"/>
              </g>
              <!-- Petal 2 (72 deg) -->
              <g transform="rotate(72)">
                <path d="M 0 -7 C -14 -14 -13 -36 0 -40 C 13 -36 14 -14 0 -7 Z" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.2" stroke-linejoin="round"/>
                <line x1="0" y1="-10" x2="0" y2="-28" stroke="#A69689" stroke-width="0.7"/>
              </g>
              <!-- Petal 3 (144 deg) -->
              <g transform="rotate(144)">
                <path d="M 0 -7 C -14 -14 -13 -36 0 -40 C 13 -36 14 -14 0 -7 Z" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.2" stroke-linejoin="round"/>
                <line x1="0" y1="-10" x2="0" y2="-28" stroke="#A69689" stroke-width="0.7"/>
              </g>
              <!-- Petal 4 (216 deg) -->
              <g transform="rotate(216)">
                <path d="M 0 -7 C -14 -14 -13 -36 0 -40 C 13 -36 14 -14 0 -7 Z" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.2" stroke-linejoin="round"/>
                <line x1="0" y1="-10" x2="0" y2="-28" stroke="#A69689" stroke-width="0.7"/>
              </g>
              <!-- Petal 5 (288 deg) -->
              <g transform="rotate(288)">
                <path d="M 0 -7 C -14 -14 -13 -36 0 -40 C 13 -36 14 -14 0 -7 Z" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.2" stroke-linejoin="round"/>
                <line x1="0" y1="-10" x2="0" y2="-28" stroke="#A69689" stroke-width="0.7"/>
              </g>

              <!-- Central core with pistil dots -->
              <circle cx="0" cy="0" r="7.5" fill="#F4F5EF" stroke="#2D321B" stroke-width="1.2"/>
              <circle cx="0" cy="0" r="3" fill="#666947"/>
            </g>
          </svg>
        </div>
        <caption class="text-[11px] font-medium tracking-[0.25em] text-[#666947] uppercase mt-2 block">
          GUL
        </caption>
      </div>

      <!-- 4. GUL TUPI -->
      <div class="flex flex-col items-center justify-between p-6 sm:p-8 rounded border border-[#F2EFE9] bg-[#FFFDFB] min-h-[220px]">
        <div class="flex-1 flex items-center justify-center w-full py-4">
          <!-- Loose cluster of three flowers with leaves and small buds arranged to sit in a page corner -->
          <svg viewBox="0 0 160 160" width="130" height="130" class="overflow-visible" xmlns="http://www.w3.org/2000/svg">
            <!-- Interconnecting curving corner stems -->
            <path d="M 28 28 Q 60 38 78 72 Q 95 105 132 132" fill="none" stroke="#2D321B" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M 40 70 Q 75 75 105 52" fill="none" stroke="#2D321B" stroke-width="1" stroke-linecap="round"/>
            
            <!-- Corner leaves -->
            <path d="M 32 34 C 20 45 22 62 38 62 C 45 50 42 38 32 34 Z" fill="#666947" fill-opacity="0.2" stroke="#2D321B" stroke-width="1.1"/>
            <path d="M 72 45 C 80 32 94 30 96 42 C 90 50 78 50 72 45 Z" fill="#666947" fill-opacity="0.2" stroke="#2D321B" stroke-width="1.1"/>
            <path d="M 85 92 C 92 82 108 84 106 96 C 98 102 88 98 85 92 Z" fill="#666947" fill-opacity="0.2" stroke="#2D321B" stroke-width="1.1"/>
            <path d="M 112 110 C 114 98 128 98 132 108 C 128 118 118 118 112 110 Z" fill="#666947" fill-opacity="0.2" stroke="#2D321B" stroke-width="1.1"/>

            <!-- Small buds with calyx -->
            <!-- Bud 1 -->
            <path d="M 30 85 Q 26 95 32 100 Q 38 95 35 85 Z" fill="#FFFDFB" stroke="#2D321B" stroke-width="1"/>
            <path d="M 26 92 Q 32 96 37 92" stroke="#666947" stroke-width="1" fill="none"/>
            <line x1="38" y1="78" x2="33" y2="86" stroke="#2D321B" stroke-width="1"/>

            <!-- Bud 2 -->
            <path d="M 118 42 Q 128 42 130 48 Q 125 54 117 50 Z" fill="#FFFDFB" stroke="#2D321B" stroke-width="1"/>
            <line x1="108" y1="50" x2="118" y2="46" stroke="#2D321B" stroke-width="1"/>

            <!-- Flower 1 (Main central flower at 75, 75) -->
            <g transform="translate(72, 72) scale(0.72)">
              <circle cx="0" cy="0" r="5" fill="#666947"/>
              <path d="M 0 0 C -8 -20 8 -20 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.3"/>
              <path d="M 0 0 C 18 -12 22 4 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.3"/>
              <path d="M 0 0 C 14 16 0 22 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.3"/>
              <path d="M 0 0 C -14 16 -18 0 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.3"/>
              <path d="M 0 0 C -20 -8 -12 -18 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.3"/>
            </g>

            <!-- Flower 2 (Top left flower at 48, 42) -->
            <g transform="translate(48, 42) scale(0.55)">
              <circle cx="0" cy="0" r="5" fill="#666947"/>
              <path d="M 0 0 C -8 -20 8 -20 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.5"/>
              <path d="M 0 0 C 18 -12 22 4 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.5"/>
              <path d="M 0 0 C 14 16 0 22 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.5"/>
              <path d="M 0 0 C -14 16 -18 0 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.5"/>
              <path d="M 0 0 C -20 -8 -12 -18 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.5"/>
            </g>

            <!-- Flower 3 (Bottom right flower at 102, 102) -->
            <g transform="translate(102, 102) scale(0.55)">
              <circle cx="0" cy="0" r="5" fill="#666947"/>
              <path d="M 0 0 C -8 -20 8 -20 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.5"/>
              <path d="M 0 0 C 18 -12 22 4 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.5"/>
              <path d="M 0 0 C 14 16 0 22 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.5"/>
              <path d="M 0 0 C -14 16 -18 0 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.5"/>
              <path d="M 0 0 C -20 -8 -12 -18 0 0" fill="#FFFDFB" stroke="#2D321B" stroke-width="1.5"/>
            </g>
          </svg>
        </div>
        <caption class="text-[11px] font-medium tracking-[0.25em] text-[#666947] uppercase mt-2 block">
          GUL TUPI
        </caption>
      </div>

      <!-- 5. BURCHAK -->
      <div class="flex flex-col items-center justify-between p-6 sm:p-8 rounded border border-[#F2EFE9] bg-[#FFFDFB] min-h-[220px]">
        <div class="flex-1 flex items-center justify-center w-full py-4">
          <!-- L-shaped corner frame ornament: two thin hairlines meeting at a right angle with a small leaf spray growing along the inside -->
          <svg viewBox="0 0 160 160" width="130" height="130" class="overflow-visible" xmlns="http://www.w3.org/2000/svg">
            <!-- L-shaped outer hairline corner -->
            <path d="M 140 30 L 30 30 L 30 140" fill="none" stroke="#2D321B" stroke-width="1" stroke-linecap="round"/>
            <!-- Subtle second parallel accent dot or hairline notch -->
            <line x1="30" y1="30" x2="38" y2="38" stroke="#A69689" stroke-width="0.8"/>
            <circle cx="140" cy="30" r="1.5" fill="#2D321B"/>
            <circle cx="30" cy="140" r="1.5" fill="#2D321B"/>

            <!-- Leaf spray growing along the inside of corner -->
            <!-- Curved vine branch hugging the inner corner -->
            <path d="M 38 115 Q 38 52 52 38 Q 78 38 115 38" fill="none" stroke="#666947" stroke-width="0.9" stroke-linecap="round"/>

            <!-- Vertical branch leaves -->
            <path d="M 38 95 C 46 92 52 86 51 79 C 43 78 38 86 38 95 Z" fill="#666947" fill-opacity="0.22" stroke="#2D321B" stroke-width="1"/>
            <path d="M 38 72 C 32 66 30 56 34 50 C 40 54 41 64 38 72 Z" fill="#666947" fill-opacity="0.22" stroke="#2D321B" stroke-width="1"/>
            
            <!-- Corner junction leaf & bud -->
            <path d="M 44 44 C 54 35 64 37 66 46 C 58 52 48 50 44 44 Z" fill="#666947" fill-opacity="0.28" stroke="#2D321B" stroke-width="1"/>
            <circle cx="58" cy="58" r="2.2" fill="#FFFDFB" stroke="#2D321B" stroke-width="1"/>

            <!-- Horizontal branch leaves -->
            <path d="M 72 38 C 78 32 86 30 92 34 C 88 41 78 41 72 38 Z" fill="#666947" fill-opacity="0.22" stroke="#2D321B" stroke-width="1"/>
            <path d="M 95 38 C 92 46 86 52 79 51 C 78 43 86 38 95 38 Z" fill="#666947" fill-opacity="0.22" stroke="#2D321B" stroke-width="1"/>
          </svg>
        </div>
        <caption class="text-[11px] font-medium tracking-[0.25em] text-[#666947] uppercase mt-2 block">
          BURCHAK
        </caption>
      </div>

      <!-- 6. BULUT -->
      <div class="flex flex-col items-center justify-between p-6 sm:p-8 rounded border border-[#F2EFE9] bg-[#FFFDFB] min-h-[220px]">
        <div class="flex-1 flex items-center justify-center w-full py-4">
          <!-- Very soft, faint cloud-like botanical wash shape, low contrast, sits far behind text -->
          <svg viewBox="0 0 160 160" width="140" height="140" class="overflow-visible" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(80, 80)">
              <!-- Soft botanical silhouette background wash in sage & olive with low opacity -->
              <!-- Outer faint silhouette -->
              <path d="M -50 -10 C -55 -35 -25 -52 5 -45 C 35 -50 58 -28 52 2 C 58 32 30 52 -5 48 C -38 52 -56 25 -50 -10 Z" 
                    fill="#666947" fill-opacity="0.07" stroke="none"/>
              
              <!-- Middle organic petal wash lobes -->
              <path d="M -35 -5 C -40 -25 -18 -38 4 -32 C 26 -36 44 -18 40 4 C 44 26 22 40 -4 36 C -28 40 -42 20 -35 -5 Z" 
                    fill="#A69689" fill-opacity="0.10" stroke="none"/>

              <!-- Whispering faint hairline contour botanical branches inside wash -->
              <path d="M -25 25 Q -10 0 15 -20 Q 28 -32 40 -35" fill="none" stroke="#666947" stroke-width="0.75" stroke-opacity="0.3" stroke-linecap="round"/>
              <path d="M -5 6 C -14 5 -18 -2 -14 -8 C -8 -5 -5 1 -5 6 Z" fill="#666947" fill-opacity="0.08" stroke="#666947" stroke-width="0.6" stroke-opacity="0.3"/>
              <path d="M 6 -12 C 14 -12 18 -6 15 0 C 9 -2 6 -8 6 -12 Z" fill="#666947" fill-opacity="0.08" stroke="#666947" stroke-width="0.6" stroke-opacity="0.3"/>
              <path d="M 22 -24 C 20 -30 25 -34 30 -30 C 29 -24 24 -22 22 -24 Z" fill="#666947" fill-opacity="0.08" stroke="#666947" stroke-width="0.6" stroke-opacity="0.3"/>

              <!-- Soft secondary branch -->
              <path d="M -15 -18 Q 5 -10 18 15" fill="none" stroke="#A69689" stroke-width="0.6" stroke-opacity="0.3" stroke-linecap="round"/>
              <circle cx="18" cy="15" r="2" fill="#A69689" fill-opacity="0.15"/>
            </g>
          </svg>
        </div>
        <caption class="text-[11px] font-medium tracking-[0.25em] text-[#666947] uppercase mt-2 block">
          BULUT
        </caption>
      </div>

    </div>

    <!-- Bottom note -->
    <footer class="mt-12 pt-6 border-t border-[#EBE8E1] flex flex-col sm:flex-row items-center justify-between text-[#A69689] text-[10px] tracking-[0.2em] uppercase">
      <span>Ranglar: #2D321B (Olive), #666947 (Sage), #A69689 (Muted)</span>
      <span class="mt-2 sm:mt-0">Vektor / Letterpress Aktivlar</span>
    </footer>

  </main>

</body>
</html>
